{% extends 'base.html' %}

{% block title %}AFFIT | Cadastrar usuário{% endblock %}

{% block content %}
<div class="container">
    <p class="eyebrow">Alunos</p>
    <h1 class="page-title">Cadastrar <span>usuário</span></h1>
    <p class="page-sub">Preencha os dados abaixo para adicionar um novo aluno.</p>

    <div class="card form-card">
        <form method="post" action="{{ url_for('usuarios.cadastrarusuario') }}">
            <div class="form-group">
                <label class="campo" for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
            </div>
            <div class="form-group">
                <label class="campo" for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="aluno@email.com" required>
            </div>
            <button type="submit" class="btn btn-block">Cadastrar</button>
        </form>
    </div>
</div>
{% endblock %}
